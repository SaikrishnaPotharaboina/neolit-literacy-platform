services:
  - type: web
    name: neolit-backend
    env: python
    rootDir: Backend
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && python -c "from app.database import SessionLocal; from app.seed import seed_learning_content; db = SessionLocal(); seed_learning_content(db); db.close()" && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://neolit-literacy-platform.vercel.app
